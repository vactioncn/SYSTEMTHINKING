<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fcfdfc"><title>系统回路 · 观局</title><link rel="stylesheet" href="/loops/style.css"></head>
<body>
<aside class="rail" aria-label="工作空间导航"><a class="mark" href="/" title="观局 · 四象限画布" aria-label="返回四象限画布"><i></i><i></i><i></i><i></i></a><a href="/" class="rail-button" title="四象限画布" aria-label="四象限画布"><span data-icon="grid"></span></a><button class="rail-button selected" title="系统回路" aria-label="系统回路"><span data-icon="orbit"></span></button><div class="rail-spacer"></div><button class="rail-button" data-action="help" title="使用方法" aria-label="使用方法"><span data-icon="help"></span></button><span class="rail-caption">MPI</span></aside>
<main class="studio">
<header class="studio-header"><div class="studio-brand">观局 <span>/</span> <strong>系统回路</strong><span class="studio-tag">CAUSAL LOOPS</span></div><div class="header-actions"><span id="save-status" class="save-status" role="status">正在打开…</span><button class="button subtle" data-action="history" title="历史版本"><span data-icon="history"></span><span class="hide-small">历史</span></button><button class="button subtle" data-action="present"><span data-icon="present"></span><span class="hide-small">演示</span></button><div class="menu-wrap"><button class="button primary" data-action="export-menu" aria-expanded="false" aria-controls="export-menu"><span data-icon="download"></span>导出</button><div id="export-menu" class="popup-menu" hidden><button data-action="export-svg">矢量图 SVG<small>清晰缩放，适合投屏与排版</small></button><button data-action="export-png">图片 PNG<small>高清白底，可直接放入演示文稿</small></button><button data-action="export-json">可编辑文件 JSON<small>保留布局、关系、依据与回路</small></button><button data-action="import">导入图文件<small>作为新图加入，保留现有内容</small></button></div></div></div></header>
<section class="document-heading"><div class="heading-main"><div class="document-meta"><button id="atlas-button" class="atlas-button" data-action="atlas"><span data-icon="folder"></span><span id="atlas-label">我的图集</span><span>⌄</span></button><span id="example-badge" class="example-badge">参考示例</span></div><button id="document-title-button" data-action="document" title="编辑标题与说明"><h1 id="document-title">系统思考，从一条联系开始。</h1><span data-icon="edit"></span></button><p id="document-subtitle">在 Codex 中继续对话，也可以在画布上自由绘制。</p></div><button class="button new-map" data-action="new"><span data-icon="plus"></span>新建图</button></section>
<div id="conflict-banner" class="conflict-banner" hidden><span id="conflict-text">另一处已更新图集，当前草稿已保留。</span><button data-action="conflict-copy">保留本图为副本并合并</button><button data-action="conflict-load">下载草稿并载入最新</button></div>
<div id="draft-banner" class="draft-banner" hidden><span>发现上次尚未保存的草稿。</span><button data-action="recover-draft">恢复为新图</button><button data-action="discard-draft">忽略草稿</button></div>
<section class="work-area">
<div class="diagram-area">
<div class="tools"><div class="tool-group" role="toolbar" aria-label="绘图工具"><button class="tool active" data-tool="select" title="选择与移动 (V)" aria-label="选择与移动"><span data-icon="cursor"></span><span>选择</span></button><button class="tool" data-tool="node" title="点击画布放置变量 (N)"><span data-icon="text"></span><span>变量</span></button><button class="tool" data-tool="edge" title="依次点击起点和终点 (C)"><span data-icon="arrow"></span><span>连线</span></button><button class="tool" data-action="loop" title="建立回路区域，可使用已选择的连线"><span data-icon="orbit"></span><span>回路</span></button></div><div class="tool-separator"></div><button class="tool icon-only" id="undo" data-action="undo" title="撤销 (⌘ Z)" aria-label="撤销"><span data-icon="undo"></span></button><button class="tool icon-only" id="redo" data-action="redo" title="重做 (⌘ ⇧ Z)" aria-label="重做"><span data-icon="redo"></span></button><div class="tool-flex"></div><button class="tool icon-only" data-action="search" title="搜索变量 (⌘ F)" aria-label="搜索变量"><span data-icon="search"></span></button><label class="focus-label"><span data-icon="focus"></span><select id="focus-loop" aria-label="聚焦回路"><option value="">全部回路</option></select></label><button class="tool icon-only" data-action="inspector" title="显示或收起属性" aria-label="显示或收起属性"><span data-icon="panel"></span></button></div>
<div id="diagram-viewport" class="diagram-viewport" tabindex="0" aria-label="系统回路绘图区域，滚轮缩放，拖动空白平移"><svg id="diagram" xmlns="http://www.w3.org/2000/svg" aria-label="系统回路图"><g id="world"></g></svg><div id="empty-state" class="empty-state" hidden><span class="empty-orbit">↗</span><h2>先放下一个变量。</h2><p>点击「变量」，再点击画布。<br>也可以在 Codex 里告诉我你想画的联系。</p><button class="button" data-action="source-nodes"><span data-icon="grid"></span>从四象限选择线索</button></div><div id="tool-hint" class="tool-hint" hidden></div><div class="canvas-bottom"><button class="canvas-pill" data-action="layout" title="重新排列现有变量与连线，可撤销"><span data-icon="layout"></span><span>整理布局</span></button><div class="canvas-bottom-right"><button class="canvas-pill icon-only" data-action="minimap" title="缩略导航" aria-label="缩略导航"><span data-icon="map"></span></button><div class="zoom-controls"><button data-action="zoom-out" title="缩小" aria-label="缩小">−</button><button id="zoom-label" data-action="zoom-reset" title="100%">100%</button><button data-action="zoom-in" title="放大" aria-label="放大">＋</button><span></span><button data-action="fit" title="适应全部内容 (F)" aria-label="适应全部内容"><span data-icon="fit"></span></button></div></div></div><div id="minimap-wrap" class="minimap-wrap" hidden><svg id="minimap" viewBox="0 0 180 112" aria-label="图形缩略导航，点击定位"></svg></div><button class="present-exit button" data-action="present"><span data-icon="present"></span>退出演示 <kbd>Esc</kbd></button></div>
<footer class="diagram-footer"><div class="legend"><span><b>＋</b>同向</span><span><b>−</b>反向</span><span><b>∥</b>延迟</span><span><i class="dashed"></i>待核实</span></div><span id="graph-count">0 变量 · 0 连线</span><span class="footer-hint">拖动空白平移 · 滚轮缩放</span></footer>
</div>
<aside id="inspector" class="inspector" hidden aria-label="图形属性"><div class="inspector-header"><span id="inspector-type">图形属性</span><button data-action="close-inspector" class="icon-button" aria-label="关闭属性">×</button></div><div id="inspector-content"></div></aside>
</section>
</main>
<div id="toast" role="status" class="toast" hidden></div>
<dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button data-action="close-modal" class="icon-button" aria-label="关闭弹窗">×</button></div><div id="modal-content"></div></dialog>
<input id="import-file" type="file" accept=".json,application/json" hidden>
<script type="module" src="/loops/editor.js"></script>
</body></html>
